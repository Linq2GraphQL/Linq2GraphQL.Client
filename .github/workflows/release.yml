name: Create Release

on: [ workflow_dispatch ]

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: dotnet/nbgv@master
        id: nbgv
      - run: echo 'SemVer2=${{ steps.nbgv.outputs.SemVer2 }}'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Linq2GraphQL.Release.slnf --locked-mode

      - name: Pack
        run: dotnet pack Linq2GraphQL.Release.slnf -c Release --no-restore -o artifacts

      - name: Push to NuGet
        run: dotnet nuget push artifacts/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nbgv.outputs.SemVer2 }}
          name: Release ${{ steps.nbgv.outputs.SemVer2 }}
          draft: false
          prerelease: ${{ !startsWith(steps.extract_branch.outputs.branch, 'release/') }}
          files: artifacts/*.nupkg
