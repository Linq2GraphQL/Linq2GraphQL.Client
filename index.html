    <base href="/"/>

    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem("l2g-theme"); } catch (e) { }
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();

        // Restores the route that 404.html (GitHub Pages SPA redirect) moved into the query string.
        (function (l) {
            var query = {};
            l.search.slice(1).split("&").forEach(function (pair) {
                var parts = pair.split("=");
                query[parts[0]] = parts.slice(1).join("=").replace(/~and~/g, "&");
            });
            if (query.p !== undefined) {
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + (query.p || "") + (query.q ? "?" + query.q : "") + l.hash);
            }
        }(window.location));
    </script>
